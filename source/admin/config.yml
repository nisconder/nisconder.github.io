backend:
  name: github
  repo: nisconder/nisconder.github.io
  branch: main
  base_url: https://netlify-cms-github-oauth-provider-qt36928cs-nisconders-projects.vercel.app
  auth_endpoint: /auth
  commit_messages:
    create: 'Create {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'
    uploadMedia: 'Upload "{{path}}"'
    deleteMedia: 'Delete "{{path}}"'
locale: zh_Hans
logo:
  src: /img/nisconder-avatar.png
  show_in_header: true
site_url: https://nisconder-blog.netlify.app
display_url: https://nisconder-blog.netlify.app
show_preview_links: true
media_folder: source/images/uploads
public_folder: /images/uploads
editor:
  preview: true
collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: source/_posts
    create: true
    slug: '{{year}}-{{month}}-{{day}}-blog{{hour}}{{minute}}{{second}}'
    summary: '{{title}}'
    sortable_fields: ['date', 'title']
    view_filters:
      - { label: 随笔, field: categories, pattern: 随笔 }
      - { label: 公告, field: categories, pattern: 公告 }
    extension: md
    format: yaml-frontmatter
    fields:
      - { label: 标题, name: title, widget: string, hint: 用一句清晰的话概括文章主题。, pattern: ['.{3,}', '标题至少需要 3 个字符'] }
      - { label: 摘要, name: description, widget: text, hint: 用 80–120 字说明文章讨论什么；将显示在首页与文章列表。 }
      - { label: 文章日期, name: date, widget: datetime, default: '{{now}}', format: 'YYYY-MM-DD HH:mm:ss', date_format: 'YYYY-MM-DD', time_format: 'HH:mm', picker_utc: false, hint: 新文章自动使用当前时间；需要回溯日期时再修改。 }
      - { label: 作为草稿, name: draft, widget: draftcontrol, default: false, required: false, hint: 保存到仓库，但不在公开网站中发布。 }
      - { label: 首页位置, name: sticky, widget: pincontrol, default: false, required: false, hint: 开启后，这篇文章会显示在普通文章之前。 }
      - { label: 分类, name: categories, widget: categoryselect, options: ['随笔', '公告', '技术', '阅读', '观影', '生活'], required: true, hint: 选择一个主分类。 }
      - { label: 标签, name: tags, widget: taglist, required: false, hint: 输入后按 Enter 添加；输入时会联想已有标签。 }
      - { label: 正文, name: body, widget: richtext, modes: ['raw'], hint: 使用 Markdown 写作；需要检查排版时，点顶部“预览文章”。 }
