backend:
  name: github
  repo: nisconder/nisconder.github.io
  branch: main
  base_url: https://netlify-cms-github-oauth-provider-qt36928cs-nisconders-projects.vercel.app
  auth_endpoint: /auth
  commit_messages:
    create: 'Create {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'
    uploadMedia: 'Upload "{{path}}"'
    deleteMedia: 'Delete "{{path}}"'
locale: zh_Hans
logo:
  src: /img/nisconder-avatar.png
  show_in_header: true
site_url: https://nisconder-blog.netlify.app
display_url: https://nisconder-blog.netlify.app
show_preview_links: true
media_folder: source/images/uploads
public_folder: /images/uploads
editor:
  preview: true
collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: source/_posts
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: ['date', 'title']
    view_filters:
      - { label: 随笔, field: categories, pattern: 随笔 }
      - { label: 公告, field: categories, pattern: 公告 }
    extension: md
    format: yaml-frontmatter
    fields:
      - { label: 标题, name: title, widget: string, hint: 用一句清晰的话概括文章主题。, pattern: ['.{3,}', '标题至少需要 3 个字符'] }
      - { label: 发布时间, name: date, widget: datetime, default: '{{now}}', format: 'YYYY-MM-DD HH:mm:ss', date_format: 'YYYY-MM-DD', time_format: 'HH:mm', picker_utc: false, hint: 新文章自动使用当前时间；需要预约发布时再修改。 }
      - { label: 首页排序, name: sticky, widget: pincontrol, default: false, required: false, hint: 选择这篇文章在首页的排列方式。 }
      - { label: 分类, name: categories, widget: select, options: ['随笔', '公告', '技术', '阅读', '观影', '生活'], required: false, hint: 每篇文章选择一个主分类。 }
      - { label: 标签, name: tags, widget: taglist, required: false, hint: 输入后按 Enter 添加；输入时会联想已有标签。 }
      - { label: 正文, name: body, widget: markdown, hint: 支持 Markdown；右侧预览会模拟主站文章排版。 }
