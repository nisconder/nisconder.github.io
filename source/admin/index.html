<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#245f64">
  <title>管理后台｜不知名博客</title>
  <link rel="icon" type="image/png" href="/img/nisconder-avatar.png">
  <link rel="stylesheet" href="/admin/admin-portal.css?v=2">
  <script>
    if (window.location.hash) {
      window.history.replaceState(null, '', '/admin/');
    }
  </script>
</head>
<body>
  <header class="portal-header">
    <a class="portal-brand" href="/" aria-label="返回不知名博客首页">
      <img src="/img/nisconder-avatar.png" alt="" width="40" height="40">
      <span>Nisconder</span>
    </a>
    <a class="portal-site-link" href="/">查看主站 <span aria-hidden="true">↗</span></a>
  </header>

  <main class="portal-main">
    <div class="portal-intro">
      <p class="portal-eyebrow">NISCONDER / ADMIN</p>
      <h1>管理后台</h1>
      <p>选择现在要处理的内容。文章与留言各自独立，但都从这里进入。</p>
    </div>

    <nav class="portal-destinations" aria-label="后台功能">
      <a class="portal-card portal-card--content" href="/admin/content/">
        <span class="portal-card__label">内容</span>
        <span class="portal-card__copy">
          <strong>文章与媒体</strong>
          <small>新建、编辑和发布文章，管理站内图片。</small>
        </span>
        <span class="portal-card__action">进入内容后台 <span aria-hidden="true">→</span></span>
      </a>

      <a class="portal-card portal-card--comments" href="/admin/comments/">
        <span class="portal-card__label">留言</span>
        <span class="portal-card__copy">
          <strong>Waline 留言</strong>
          <small>查看、回复、审核和置顶全站留言。</small>
        </span>
        <span class="portal-card__action">进入留言后台 <span aria-hidden="true">→</span></span>
      </a>
    </nav>
  </main>

  <footer class="portal-footer">
    <span>一个入口，两套管理工具。</span>
    <a href="/admin/content/#/collections/posts/new">直接新建文章</a>
  </footer>
</body>
</html>
