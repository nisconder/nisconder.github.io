[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"
  NPM_FLAGS = "--ignore-scripts"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 302
  force = true

[[redirects]]
  from = "/admin/index.html"
  to = "/admin/"
  status = 302
  force = true

[[redirects]]
  from = "/admin/content"
  to = "/admin/content/"
  status = 302
  force = true

[[redirects]]
  from = "/admin/comments"
  to = "/admin/comments/"
  status = 302
  force = true

[[redirects]]
  from = "/archives/*"
  to = "/articles/"
  status = 301
  force = true

[[redirects]]
  from = "/categories/*"
  to = "/articles/"
  status = 301
  force = true

[[redirects]]
  from = "/tags/*"
  to = "/articles/"
  status = 301
  force = true

[[redirects]]
  from = "/archives"
  to = "/articles/"
  status = 301
  force = true

[[redirects]]
  from = "/categories"
  to = "/articles/"
  status = 301
  force = true

[[redirects]]
  from = "/tags"
  to = "/articles/"
  status = 301
  force = true

[[redirects]]
  from = "/link"
  to = "/about/"
  status = 301
  force = true

[[redirects]]
  from = "/movies"
  to = "/music/"
  status = 301
  force = true

[[redirects]]
  from = "/resources"
  to = "/software/"
  status = 301
  force = true

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
